name: ci
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - name: Install PostgreSQL
        run: sudo apt-get update && sudo apt-get install -y postgresql postgresql-contrib
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run lint:licenses
      - run: npm run secrets
      - name: Production vulnerability audit
        run: npm audit --omit=dev --audit-level=high
      - name: Test
        run: |
          PGBIN="$(dirname "$(readlink -f "$(command -v initdb || true)")")"
          if [ ! -x "$PGBIN/initdb" ]; then
            PGBIN="$(dirname "$(find /usr/lib/postgresql -name initdb | head -n1)")"
          fi
          echo "PGBIN=$PGBIN"
          PGBIN="$PGBIN" npm test
      - name: SBOM
        run: npm run sbom
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cyclonedx-sbom
          path: sbom.cdx.json
